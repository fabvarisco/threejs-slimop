<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Slimop</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #151816;
        color: #f3f7f1;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        background-color: #151816;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Slimop"></canvas>
      <div id="absorption-feedback" class="absorption-feedback" aria-hidden="true"></div>

      <div class="hud top-left">
        <div class="stat">
          <span>Level</span>
          <strong id="phase-value">1</strong>
        </div>
        <div class="stat rank-stat">
          <span>Rank</span>
          <strong id="rank-value">#1</strong>
          <small id="score-value">0 pts</small>
        </div>
        <div class="stat">
          <span>Time</span>
          <strong id="time-value">00:00</strong>
        </div>
        <div class="stat mass-stat">
          <span>Mass</span>
          <strong id="mass-value">0</strong>
          <small id="unlock-value">Vehicles: 0%</small>
          <div class="growth-track" aria-hidden="true"><i id="growth-meter"></i></div>
        </div>
        <div class="stat wide" title="City mass consumed by all slimes">
          <span>City</span>
          <div class="meter" id="city-progress" role="progressbar" aria-label="City consumed by all slimes" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="city-meter"></i></div>
          <strong id="city-value">0%</strong>
        </div>
      </div>

      <div id="threat-alert" class="threat-alert hidden" aria-live="polite">
        <span class="threat-icon">⚠️</span>
        <span id="threat-text">Danger! Rival nearby</span>
      </div>

      <div id="unlock-banner" class="unlock-banner hidden" aria-live="polite"></div>

      <aside class="leaderboard" aria-label="Leaderboard">
        <div class="leaderboard-heading"><h1>Slimop</h1><small>Points</small></div>
        <div id="rank-list"></div>
      </aside>

      <div class="center-state" id="center-state">
        <div class="state-panel">
          <h2 id="state-title">Loading</h2>
          <p id="state-detail">Building the city</p>
          <button id="state-action" type="button">Play</button>
        </div>
      </div>

      <div class="touch-stick" id="touch-stick" aria-hidden="true">
        <i id="touch-knob"></i>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
